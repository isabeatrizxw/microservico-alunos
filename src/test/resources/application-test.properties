# Testes: H2 em memoria (nada fica salvo em disco), mesmo modo PostgreSQL do dev
spring.datasource.url=jdbc:h2:mem:testes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Os testes fazem muitos logins seguidos do mesmo IP: limites altos para nao se bloquearem.
# O bloqueio em si e testado em LimiteDeTentativasLoginTest, que baixa estes valores.
app.limite.login-por-email=1000
app.limite.login-por-ip=1000
app.limite.cadastro-por-ip=1000
