spring.application.name=microservico
server.port=8080

# Perfil padrao: dev (H2 em arquivo). Producao: SPRING_PROFILES_ACTIVE=prod (PostgreSQL)
spring.profiles.default=dev

# O esquema do banco e criado pelas migracoes do Flyway (src/main/resources/db/migration);
# o Hibernate so confere se as entidades batem com as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Primeiro SUPER_ADMIN (dono do sistema), criado ao iniciar se ainda nao existir.
# Defina as variaveis de ambiente; nunca escreva a senha aqui.
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.senha=${SUPER_ADMIN_SENHA:}

# Endereco publico do sistema, usado nos links enviados por e-mail (confirmacao, convites)
app.url-publica=${URL_PUBLICA:http://localhost:8080}
app.email.remetente=${EMAIL_REMETENTE:nao-responda@localhost}

# Limite de tentativas (contra robos testando senhas ou criando contas em massa)
# Login: falhas por e-mail e por IP em 15 minutos. Cadastro: tentativas por IP em 1 hora.
app.limite.login-por-email=10
app.limite.login-por-ip=50
app.limite.cadastro-por-ip=5
# "Esqueci minha senha": pedidos por IP e por e-mail em 1 hora
app.limite.redefinicao-por-ip=5
app.limite.redefinicao-por-email=3

# Sessao de login expira apos 30 minutos sem uso
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax

# Nota minima para aprovacao (pode ser alterada sem recompilar o codigo)
aluno.nota-de-corte=5.0
