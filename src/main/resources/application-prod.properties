# Producao: PostgreSQL. Credenciais vem de variaveis de ambiente (nunca coloque senha aqui)
# Ex.: DB_URL=jdbc:postgresql://localhost:5432/microservico
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# E-mail: SMTP obrigatorio em producao (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD). Sem ele a aplicacao nao sobe, para nenhum link ir parar no log.
app.email.exigir-smtp=true

# Em producao o site roda em HTTPS: cookie de sessao so trafega criptografado
server.servlet.session.cookie.secure=true
